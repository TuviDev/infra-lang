[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infra-lang"
version = "0.1.0"
description = "Infrastructure as Code DSL — compile to Kubernetes, Docker Compose, Terraform, GitHub Actions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
    "infrastructure", "devops", "dsl",
    "kubernetes", "terraform", "docker",
    "iac", "platform-engineering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Compilers",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "lark>=1.1.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "ruamel.yaml>=0.18.0",
    "pyyaml>=6.0",
    "watchdog>=4.0.0",
    "prompt_toolkit>=3.0.0",
]

[project.optional-dependencies]
lsp = ["pygls>=1.3.0,<2.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.0.0",
    "hypothesis>=6.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.0.0",
    "pygls>=1.3.0,<2.0",
]

[project.scripts]
infra = "infra.cli.main:app"

[project.urls]
Homepage = "https://github.com/infra-lang/infra-lang"
Repository = "https://github.com/infra-lang/infra-lang"
Documentation = "https://infra-lang.readthedocs.io"
"Bug Tracker" = "https://github.com/infra-lang/infra-lang/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/infra"]

[tool.hatch.build]
include = [
    "src/infra/**/*.py",
    "src/infra/**/*.lark",
    "src/infra/**/*.infra",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto --dist=loadfile"
markers = [
    "unit: isolated, fast, no I/O",
    "integration: multiple modules together",
    "e2e: full user flow with subprocess",
    "slow: takes > 2 seconds",
    "behavioral: business behavior documentation",
    "contracts: public API contract tests",
    "live_e2e: real Docker/kind/kubectl E2E (skipped when tools missing)",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/infra"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
fail_under = 88
show_missing = true

[tool.mutmut]
source_paths = ["src/infra/analyzer/reliability.py"]
backup = false
runner = "python -m pytest -x -q -p no:cacheprovider --no-cov tests/test_reliability.py"
