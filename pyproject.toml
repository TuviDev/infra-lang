[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infra-lang"
version = "0.5.6"
description = "Write infrastructure once, compile it to Kubernetes, Compose, or GitHub Actions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
    "infrastructure", "kubernetes", "docker-compose", "github-actions",
    "terraform", "devops", "dsl", "iac", "infrastructure-as-code",
    "platform-engineering", "sre",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "lark>=1.1.0,<2.0.0",
    "typer>=0.9.0,<1.0.0",
    "rich>=13.0.0,<16.0.0",
    "ruamel.yaml>=0.18.0,<1.0.0",
    "pyyaml>=6.0,<7.0",
    "watchdog>=4.0.0,<7.0.0",
    "prompt_toolkit>=3.0.0,<4.0.0",
]

[project.optional-dependencies]
lsp = ["pygls>=1.3.0,<3.0.0"]
docs = [
    "mkdocs-material>=9.5",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-timeout>=2.2.0,<3.0.0",
    "hypothesis>=6.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.0.0",
    "pygls>=1.3.0,<3.0.0",
]

[project.scripts]
infra = "infra.cli.main:app"

[project.urls]
Homepage = "https://github.com/TuviDev/infra-lang"
Repository = "https://github.com/TuviDev/infra-lang"
Documentation = "https://github.com/TuviDev/infra-lang#readme"
"Bug Tracker" = "https://github.com/TuviDev/infra-lang/issues"
Changelog = "https://github.com/TuviDev/infra-lang/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/infra"]

[tool.hatch.build]
include = [
    "src/infra/**/*.py",
    "src/infra/**/*.lark",
    "src/infra/**/*.infra",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""
timeout = 60
markers = [
    "unit: isolated, fast, no I/O",
    "integration: multiple modules together",
    "e2e: full user flow with subprocess",
    "slow: takes > 2 seconds",
    "behavioral: business behavior documentation",
    "contracts: public API contract tests",
    "live_e2e: real Docker/kind/kubectl E2E (skipped when tools missing)",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Dual-stack LSP support: infra/lsp/server.py is checked against BOTH the
# legacy pygls 1.3.x / lsprotocol 2023.x stack and the modern pygls 2.x one.
#  * warn_unused_ignores: the module carries ``# type: ignore[attr-defined]``
#    on guarded imports that only fail on the legacy stack; on the modern
#    stack those ignores are intentionally unused, so the per-file
#    unused-ignore warning (enabled by --strict) must stay off here.
#  * allow_untyped_decorators: pygls 1.3.x ships untyped ``@server.feature``
#    decorators; pygls 2.x decorators are fully typed, so the flag is inert
#    on the modern stack.
module = "infra.lsp.server"
warn_unused_ignores = false
allow_untyped_decorators = true

[tool.coverage.run]
source = ["src/infra"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mutmut]
# Mutation testing. NOTE: the project uses a src/ layout; mutmut's coverage
# mapping needs a flat package copy to associate tests with mutants. See
# docs/testing_quality.md for the exact working procedure (run from a flat
# copy with `source_paths = ["infra"]`).
source_paths = ["src/infra"]
pytest_add_cli_args = ["-q", "-p", "no:cacheprovider", "-o", "addopts=", "-k", "not live_e2e"]
pytest_add_cli_args_test_selection = ["tests/test_security_checker.py", "tests/test_security_advanced.py"]

[tool.vulture]
paths = ["src/infra"]
min_confidence = 80
ignore_names = ["environment", "project", "no_color"]
