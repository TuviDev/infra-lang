name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build twine
          # Pin the LSP stack. The server targets pygls 1.x / lsprotocol
          # 2023.0.1; pygls 2.x has a different API and makes the LSP tests
          # skip, which would silently drop coverage below the gate.
          pip install "pygls==1.3.1" "lsprotocol==2023.0.1"

      - name: Build package (wheel + sdist)
        run: python -m build

      - name: Compile VS Code extension
        working-directory: vscode-infra-lang
        run: |
          npm ci --no-audit --no-fund
          npm run compile

      - name: Lint
        run: ruff check src/

      - name: Type check
        run: mypy src/infra --ignore-missing-imports

      - name: Tests + coverage
        run: |
          pytest tests/ -q -n auto --dist=loadfile \
            --cov=src/infra --cov-report=term \
            --cov-fail-under=90

      - name: Verify package (twine check)
        run: twine check dist/*
