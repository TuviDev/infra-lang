name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (py ${{ matrix.python-version }} @ ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python dependencies
        shell: bash
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build twine
          # Pin the LSP stack. The server targets pygls 1.x / lsprotocol
          # 2023.0.1; pygls 2.x has a different API and makes the LSP tests
          # skip, which would silently drop coverage below the gate.
          pip install "pygls==1.3.1" "lsprotocol==2023.0.1"

      - name: Smoke test CLI
        shell: bash
        run: |
          python -m infra --version
          python -m infra --help

      - name: Build package (wheel + sdist)
        shell: bash
        run: python -m build

      - name: Compile VS Code extension
        working-directory: vscode-infra-lang
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run compile

      - name: Lint
        run: ruff check src/

      - name: Type check
        run: mypy src/infra --ignore-missing-imports

      - name: Tests + coverage
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Windows runners: xdist "-n auto" + coverage + server/watchdog/
            # subprocess tests can deadlock on pipe buffer / file locks
            # (CI Run 33263853504). Two workers keep I/O contention bounded.
            pytest tests/ -q -n 2 --dist=loadfile \
              --cov=src/infra --cov-report=term \
              --cov-fail-under=90
          else
            pytest tests/ -q -n auto --dist=loadfile \
              --cov=src/infra --cov-report=term \
              --cov-fail-under=90
          fi

      - name: Verify package (twine check)
        shell: bash
        run: twine check dist/*
