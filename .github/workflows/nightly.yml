name: Nightly

# Full-suite nightly: the per-PR pipeline runs Windows in smoke profile
# (`-m "not slow"`, no xdist/coverage); the slow sections (chaos storms,
# watch-mode sleeps, subprocess CLI battery, packaging integration) need a
# scheduled place where they still run daily on every OS. Trigger manually
# any time with: gh workflow run nightly.yml

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  nightly:
    name: Full suite (py ${{ matrix.python-version }} @ ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Python dependencies
        shell: bash
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build twine
          # Pin the LSP stack (same as CI): pygls 1.x / lsprotocol 2023.0.1.
          pip install "pygls==1.3.1" "lsprotocol==2023.0.1"

      - name: Build package (wheel + sdist)
        shell: bash
        run: python -m build

      - name: Compile VS Code extension
        working-directory: vscode-infra-lang
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run compile

      - name: Lint
        run: ruff check src/

      - name: Type check
        run: mypy src/infra --ignore-missing-imports

      - name: Tests (FULL suite incl. slow)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Windows nightly: full suite (all markers) but still sequential
            # and without coverage — xdist/pipe-buffer deadlocks (see
            # TEST_PERF_DIAG.md), coverage gate lives on unix below.
            pytest tests/ -q -o addopts=""
          else
            pytest tests/ -q -n auto --dist=loadfile \
              --cov=src/infra --cov-report=term \
              --cov-fail-under=90
          fi

      - name: Verify package (twine check)
        shell: bash
        run: twine check dist/*
