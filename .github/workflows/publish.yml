name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # NOTE: the `secrets` context is not available in a job-level `if` (the
    # GitHub Actions parser rejects the whole workflow), so the token guard
    # lives on the upload step below via the `env` context instead.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packaging tools
        run: pip install --upgrade pip build twine

      - name: Build wheel + sdist
        run: python -m build

      - name: Verify package
        run: twine check dist/*

      - name: Upload to PyPI
        # Only attempt the upload when a PyPI token is configured, so a tag
        # push without secrets skips publishing instead of failing. Build and
        # `twine check` above still validate every tagged release.
        if: env.TWINE_PASSWORD != ''
        # Idempotent: re-tagging the same version (or a retried publish run)
        # makes PyPI return 400 for already-uploaded files; skip them.
        run: twine upload --skip-existing dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
