name: Publish Extension

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish .vsix to Marketplace / Open VSX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-infra-lang/package-lock.json

      - name: Install dependencies
        working-directory: vscode-infra-lang
        run: npm ci --no-audit --no-fund

      - name: Compile TypeScript
        working-directory: vscode-infra-lang
        run: npm run compile

      - name: Package .vsix
        working-directory: vscode-infra-lang
        run: npx @vscode/vsce package --no-dependencies

      - name: Publish to VS Code Marketplace
        if: "${{ secrets.VSCE_PAT != '' }}"
        working-directory: vscode-infra-lang
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --pat "$VSCE_PAT"

      - name: Publish to Open VSX
        if: "${{ secrets.OVSX_TOKEN != '' }}"
        working-directory: vscode-infra-lang
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: npx ovsx publish -p "$OVSX_TOKEN"

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: infra-lang-vsix
          path: vscode-infra-lang/*.vsix
          if-no-files-found: warn
